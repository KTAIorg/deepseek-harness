# 无流量 OCI canary。不修改原 Deployment；现有 Service 的 selector 匹配不到这些 Pod。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-harness-oci-canary
  labels:
    app.kubernetes.io/name: deepseek-harness
    app.kubernetes.io/instance: oci-canary
  namespace: kt-deepseek-harness
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deepseek-harness-oci-canary
      app.kubernetes.io/instance: oci-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepseek-harness-oci-canary
        app.kubernetes.io/instance: oci-canary
    spec:
      imagePullSecrets:
      - name: oci-pull
      containers:
      - name: auth-gateway
        image: oci.ktyun.cc/ktaiorg/dsh-auth-gateway:sha-faeebfd26b30
        ports:
        - name: http
          containerPort: 8081
        env:
        - name: IDENTITY_BASE_URL
          value: http://kt-identity-api.kt-identity-prod.svc.cluster.local:8080
        - name: UPSTREAM
          value: http://127.0.0.1:8080
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: dsh-auth-secrets
              key: SESSION_SECRET
        - name: ALLOWED_ACCOUNTS
          valueFrom:
            secretKeyRef:
              name: dsh-auth-secrets
              key: ALLOWED_ACCOUNTS
        - name: COOKIE_SECURE
          value: 'true'
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
      - name: dsh
        image: oci.ktyun.cc/ktaiorg/deepseek-harness:sha-1f394ba1fc16
        args:
        - --host
        - 127.0.0.1
        - --port
        - '3080'
        - --trusted-host
        - dsh.ktyun.cc
        env:
        - name: DSH_HOME
          value: /dsh-home
        volumeMounts:
        - name: dsh-home
          mountPath: /dsh-home
        startupProbe:
          exec:
            command:
            - node
            - -e
            - fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          exec:
            command:
            - node
            - -e
            - fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - node
            - -e
            - fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
      - name: web-proxy
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: dsh-web.conf
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: dsh-home
        emptyDir: {}
      - name: nginx-conf
        configMap:
          name: deepseek-harness-nginx
