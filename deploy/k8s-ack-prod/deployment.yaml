apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-harness
  labels:
    app.kubernetes.io/name: deepseek-harness
spec:
  # DSH_HOME 为 RWO PVC，滚动更新会 Multi-Attach 失败，用 Recreate
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deepseek-harness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepseek-harness
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        # dsh web 只绑定 127.0.0.1（上游安全策略），由 web-proxy 暴露 Pod 端口
        - name: dsh
          image: ghcr.io/ktaiorg/deepseek-harness:sha-000000000000
          args:
            - --host
            - "127.0.0.1"
            - --port
            - "3080"
          env:
            - name: DSH_HOME
              value: /dsh-home
          volumeMounts:
            - name: dsh-home
              mountPath: /dsh-home
          # kubelet 探针无法访问容器 loopback，用 exec 探测
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
        - name: web-proxy
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: dsh-web.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: dsh-home
          persistentVolumeClaim:
            claimName: dsh-home
        - name: nginx-conf
          configMap:
            name: deepseek-harness-nginx
