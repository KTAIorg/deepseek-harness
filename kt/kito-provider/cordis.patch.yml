# Kito route. The model list is loaded from the signed-in account's
# https://ktapi.cc/v1/models, so a model the gateway adds shows up without a
# configuration edit. A later profile patch replaces this whole llm-pi-ai
# config, so keep providers.kito when editing Models settings.
- id: kito-provider
  name: '@kito/dsh-kito-provider'
- id: llm-pi-ai
  config:
    providers:
      kito:
        displayName: Kito
        apiKeyEnv: KITO_NEWAPI_API_KEY
        api: openai-completions
        baseURL: https://ktapi.cc/v1
        liveModels: true
        defaultContextWindow: 131072
        defaultMaxTokens: 32768
        compat:
          thinkingFormat: deepseek
          supportsDeveloperRole: false
