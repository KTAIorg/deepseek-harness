# Kito route. The client sends the KT Identity token; NewAPI validates it and
# selects the matching managed relay token server-side. Claude models are listed
# by the same live /v1/models catalog, so this file declares one provider.
- id: kito-provider
  name: '@kito/dsh-kito-provider'
- id: llm-pi-ai
  config:
    providers:
      kito:
        displayName: Kito
        apiKeyEnv: KITO_IDENTITY_TOKEN
        api: openai-completions
        baseURL: https://ktapi.cc/v1
        liveModels: true
        defaultContextWindow: 131072
        defaultMaxTokens: 32768
        headers:
          X-Kito-Token-Name: kito
        compat:
          thinkingFormat: deepseek
          supportsDeveloperRole: false
